<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thornveil Wiki</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0c; overflow: hidden; }
  canvas#wiki { display: block; width: 100vw; height: 100vh; outline: none; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); color: #9fe09a; font: 16px monospace; text-align: center; white-space: pre-line; }
</style>
</head>
<body>
<canvas id="wiki" tabindex="0"></canvas>
<div id="status">Loading the Thornveil Wiki...</div>
<script type="module">
  const st = document.getElementById('status');
  if (!navigator.gpu) {
    st.textContent = 'This wiki is the game itself running in your browser, and it needs WebGPU.\nUse a current Chrome, Edge or Safari.';
  } else {
    import('./pkg/thornveil_wiki_web.js').then(m => m.default()).then(() => document.getElementById('wiki').focus())
      .catch(e => { if (!String(e).includes('Using exceptions for control flow')) { st.textContent = 'The wiki failed to start:\n' + e; console.error(e); } });
  }
</script>
</body>
</html>
